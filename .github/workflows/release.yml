name: Build & Release App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analysis & unit tests
        run: |
          flutter analyze
          flutter test

  build-release:
    name: Build & Release APK
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split & Universal Release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare Release Artifacts & Signing Info
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/pocket-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/pocket-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/pocket-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/pocket-universal.apk

          keytool -list -v -keystore android/app/pocket-release.keystore -alias androiddebugkey -storepass android -keypass android > release-artifacts/SIGNING_FINGERPRINTS.txt

          echo "Prepared release artifacts:"
          ls -lh release-artifacts
          cat release-artifacts/SIGNING_FINGERPRINTS.txt

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-release-apks
          path: app/release-artifacts/*
          retention-days: 30

      - name: Create GitHub Release & Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
