name: Build & Publish Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          # Universal APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/pocket-universal.apk
          fi
          # Split APKs (smaller file sizes for specific architectures)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/pocket-arm64-v8a.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/pocket-armeabi-v7a.apk
          fi
          # App Bundle for Google Play
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab release-artifacts/pocket-release.aab
          fi
          ls -lh release-artifacts

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: pocket-android-builds
          path: release-artifacts/*

      - name: Attach Artifacts to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

